// ---------------------------------------------------------------- import starter spots (moderators)
const normName = (n) => (n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

/** Adds every starter spot that isn't on the map yet (same name, or a place within 100 m). */
async function importSpots() {
  if (!Repo.isMod) return;
  const existing = await Repo.places();
  const todo = URBEX_SPOTS.filter((s) => !existing.some((p) =>
    normName(p.name) === normName(s.name) || distMeters([p.lat, p.lng], [s.lat, s.lng]) < 100));
  if (!todo.length) { toast('All ' + URBEX_SPOTS.length + ' spots are already on the map.'); return; }
  const ok = await confirmDialog('Import urbex spots?',
    todo.length + ' known abandoned places will be added to the map under your name' +
    (todo.length < URBEX_SPOTS.length ? ' (' + (URBEX_SPOTS.length - todo.length) + ' are already there).' : '.') +
    ' Many are private or guarded, so check the note before going.', 'Import', false);
  if (!ok) return;
  let added = 0, failed = 0;
  for (const s of todo) {
    toast('Adding ' + (added + failed + 1) + ' of ' + todo.length + '…');
    try { await Repo.addPlace(s.name, s.address, s.note, s.lat, s.lng, { visited: false }); added++; } catch (e) {
      if (e.status === SIGNED_OUT) { handleError(e); return; }
      failed++;
    }
  }
  toast(failed ? 'Added ' + added + ', ' + failed + ' failed. Run it again to retry.' : 'Added ' + added + ' urbex spots.');
  state.positioned = false;
  await loadPlaces();
}

function distMeters(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function openSettings() {
  const body = el('div', null);
  body.appendChild(el('div', { class: 'menu-who' },
    el('div', { class: 'card-title', text: Repo.myName || '' }),
    el('div', { class: 'muted small', text: '@' + (Repo.myId || '') + (Repo.isMod ? ' \u00b7 Moderator' : '') })));
  body.appendChild(toggleRow('Light theme', 'Switch between light and dark.', currentTheme() === 'light', (on) => {
    applyTheme(on ? 'light' : 'dark');
  }));
  const modButtons = Repo.isMod && URBEX_SPOTS.length ? [{
    label: 'Import urbex spots', onClick: () => { setTimeout(() => importSpots().catch(handleError), 0); return true; },
  }] : [];
  dialog('Settings', body, modButtons.concat([
    {
      label: 'Log out', kind: 'danger-outline', onClick: async () => {
        const ok = await confirmDialog('Really log out?',
          Repo.isMod ? 'You\u2019ll need a new key to log back in. If you\u2019re the only moderator, make a second moderator first.' : 'You\u2019ll need a new key to log back in.',
          'Log out', true);
        if (!ok) return true;
        await Repo.logout();
        showLogin();
        return true;
      },
    },
    { label: 'Close', kind: 'primary', value: null },
  ]));
}

// ---------------------------------------------------------------- wire up
async function boot() {
  applyTheme(currentTheme());
  $('login-form').addEventListener('submit', doLogin);
  $('setup-form').addEventListener('submit', doSetup);
  for (const name of ['map', 'places', 'chat', 'accounts']) $('tab-' + name).addEventListener('click', () => selectTab(name));
  $('menu').addEventListener('click', openSettings);
  $('fab-add').addEventListener('click', () => openAddPlace(null, false));
  $('fab-locate').addEventListener('click', tapLocate);
  $('places-add').addEventListener('click', () => openAddPlace(null, false));
  for (const k of Object.keys(FILTERS)) $('filter-' + k).addEventListener('click', () => { state.filter = k; renderPlaces(); });
  $('place-back').addEventListener('click', closePlace);
  $('place-file').addEventListener('change', (e) => { const f = Array.from(e.target.files || []); e.target.value = ''; addPhotosToOpenPlace(f); });
  $('add-file').addEventListener('change', (e) => { const f = Array.from(e.target.files || []); e.target.value = ''; onAddFiles(f); });
  $('viewer-close').addEventListener('click', closeViewer);
  $('viewer-prev').addEventListener('click', () => { state.viewerIndex--; showViewerPhoto(); });
  $('viewer-next').addEventListener('click', () => { state.viewerIndex++; showViewerPhoto(); });
  $('viewer-delete').addEventListener('click', deleteViewerPhoto);
  $('accounts-new').addEventListener('click', newAccount);
  $('chat-form').addEventListener('submit', doSend);
  $('chat-back').addEventListener('click', closeChat);
  $('dm-new').addEventListener('click', newDmPicker);
  $('chat-input').addEventListener('input', (e) => autoGrow(e.target));
  $('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('chat-form').requestSubmit(); }
  });
  $('add-back').addEventListener('click', () => { $('add-sheet').hidden = true; });
  $('add-search-form').addEventListener('submit', doAddSearch);
  $('add-save').addEventListener('click', doAddSave);

  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    showLogin('Open this app over https (the GitHub Pages link), not as a local file.');
    return;
  }
  await Repo.loadSaved();
  if (Repo.loggedIn && CONFIGURED) enterApp();
  else showLogin();
}

// Installed-app support: save the app on the phone so it opens without signal.
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* still works online */ });
}
window.addEventListener('offline', () => toast('You’re offline. Saved screens still open; changes need signal.'));
window.addEventListener('online', () => { if (Repo.loggedIn && !$('app').hidden) loadPlaces(); });

// Forms must never submit as plain HTML (e.g. before the app has started).
document.addEventListener('submit', (e) => e.preventDefault(), true);

if (window.L) boot();
else {
  window.addEventListener('leaflet-ready', boot, { once: true });
  // The map library comes from a CDN; if it never arrives, say so instead of showing a dead page.
  setTimeout(() => {
    if (window.L) return;
    const info = $('login-info');
    $('login').hidden = false;
    $('login-form').hidden = true;
    info.hidden = false;
    info.textContent = 'Couldn’t load the map library. Check your internet connection and reload the page.';
  }, 12000);
}
</script>
